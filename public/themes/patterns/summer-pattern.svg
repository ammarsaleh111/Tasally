<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Sunbeam radial -->
    <radialGradient id="sunbeam" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <!-- Wave pattern -->
    <pattern id="summer-waves" patternUnits="userSpaceOnUse" width="60" height="30">
      <path d="M0 15 Q15 5 30 15 T60 15" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15"/>
      <path d="M0 25 Q15 15 30 25 T60 25" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#sunbeam)"/>
  <rect width="100" height="100" fill="url(#summer-waves)"/>
</svg>
