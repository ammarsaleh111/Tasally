<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Ocean waves -->
    <pattern id="summer-waves" patternUnits="userSpaceOnUse" width="100" height="50">
      <path d="M0 25 Q12.5 15 25 25 T50 25 T75 25 T100 25" fill="none" stroke="#00CED1" stroke-width="2" opacity="0.3"/>
      <path d="M0 35 Q12.5 25 25 35 T50 35 T75 35 T100 35" fill="none" stroke="#20B2AA" stroke-width="1.5" opacity="0.2"/>
      <path d="M0 45 Q12.5 38 25 45 T50 45 T75 45 T100 45" fill="none" stroke="#48D1CC" stroke-width="1" opacity="0.15"/>
    </pattern>
    
    <!-- Sun rays radiating -->
    <pattern id="summer-sunrays" patternUnits="userSpaceOnUse" width="150" height="150">
      <g transform="translate(75, 75)" opacity="0.25">
        <circle r="15" fill="#FFD700"/>
        <!-- Radiating rays -->
        <line x1="0" y1="-20" x2="0" y2="-35" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="-14" x2="25" y2="-25" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="20" y1="0" x2="35" y2="0" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="14" y1="14" x2="25" y2="25" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="20" x2="0" y2="35" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="-14" y1="14" x2="-25" y2="25" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="-20" y1="0" x2="-35" y2="0" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
        <line x1="-14" y1="-14" x2="-25" y2="-25" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
      </g>
    </pattern>
    
    <!-- Beach elements -->
    <pattern id="summer-beach" patternUnits="userSpaceOnUse" width="120" height="120">
      <!-- Palm tree silhouette -->
      <g transform="translate(60, 80)" fill="#228B22" opacity="0.2">
        <rect x="-2" y="0" width="4" height="30" fill="#8B4513"/>
        <path d="M0 0 Q-25 -5 -30 10 Q-20 5 0 5 Z"/>
        <path d="M0 0 Q25 -5 30 10 Q20 5 0 5 Z"/>
        <path d="M0 -2 Q-20 -15 -25 0 Q-15 -5 0 2 Z"/>
        <path d="M0 -2 Q20 -15 25 0 Q15 -5 0 2 Z"/>
        <path d="M0 -3 Q-15 -25 -10 -10 Q-5 -15 0 0 Z"/>
        <path d="M0 -3 Q15 -25 10 -10 Q5 -15 0 0 Z"/>
      </g>
      <!-- Starfish -->
      <g transform="translate(20, 30)" fill="#FF6347" opacity="0.3">
        <path d="M5 0 L6 4 L10 5 L6 6 L5 10 L4 6 L0 5 L4 4 Z"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#summer-waves)"/>
  <rect width="200" height="200" fill="url(#summer-sunrays)"/>
  <rect width="200" height="200" fill="url(#summer-beach)"/>
</svg>
