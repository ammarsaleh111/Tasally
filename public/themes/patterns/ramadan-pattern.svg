<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Islamic geometric pattern -->
    <pattern id="ramadan-geometric" patternUnits="userSpaceOnUse" width="40" height="40">
      <!-- 8-pointed star -->
      <polygon points="20,2 23,14 35,14 25,22 28,34 20,26 12,34 15,22 5,14 17,14" 
               fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.08"/>
      <!-- Inner star -->
      <polygon points="20,8 22,16 30,16 24,21 26,29 20,24 14,29 16,21 10,16 18,16" 
               fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    <!-- Stars scatter -->
    <pattern id="ramadan-stars" patternUnits="userSpaceOnUse" width="60" height="60">
      <circle cx="10" cy="10" r="0.5" fill="currentColor" opacity="0.2"/>
      <circle cx="50" cy="30" r="0.3" fill="currentColor" opacity="0.15"/>
      <circle cx="30" cy="50" r="0.4" fill="currentColor" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#ramadan-geometric)"/>
  <rect width="100" height="100" fill="url(#ramadan-stars)"/>
</svg>
