<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Cherry blossoms scattered -->
    <pattern id="spring-blossoms" patternUnits="userSpaceOnUse" width="50" height="50">
      <!-- 5-petal cherry blossom -->
      <g transform="translate(25, 25)" fill="#FF69B4" opacity="0.6">
        <circle cx="0" cy="-6" r="3"/>
        <circle cx="5.7" cy="-1.85" r="3"/>
        <circle cx="3.5" cy="4.85" r="3"/>
        <circle cx="-3.5" cy="4.85" r="3"/>
        <circle cx="-5.7" cy="-1.85" r="3"/>
        <circle cx="0" cy="0" r="2" fill="#FFD700" opacity="0.8"/>
      </g>
      <!-- Small floating petals -->
      <ellipse cx="10" cy="40" rx="3" ry="1.5" fill="#FFB6C1" opacity="0.4" transform="rotate(25, 10, 40)"/>
      <ellipse cx="42" cy="15" rx="2.5" ry="1.2" fill="#FFB6C1" opacity="0.35" transform="rotate(-15, 42, 15)"/>
    </pattern>
    
    <!-- Gentle vine swirls -->
    <pattern id="spring-vines" patternUnits="userSpaceOnUse" width="100" height="100">
      <path d="M0 50 Q25 30 50 50 T100 50" fill="none" stroke="#90EE90" stroke-width="1" opacity="0.25"/>
      <path d="M0 75 Q30 60 60 75 T100 75" fill="none" stroke="#98FB98" stroke-width="0.8" opacity="0.2"/>
      <!-- Tiny leaves on vines -->
      <path d="M30 45 Q35 40 40 45 Q35 50 30 45" fill="#90EE90" opacity="0.3"/>
      <path d="M70 70 Q75 65 80 70 Q75 75 70 70" fill="#98FB98" opacity="0.25"/>
    </pattern>
    
    <!-- Butterfly silhouettes -->
    <pattern id="spring-butterflies" patternUnits="userSpaceOnUse" width="150" height="150">
      <g transform="translate(100, 40)" fill="#DDA0DD" opacity="0.35">
        <path d="M0 0 C-8 -8 -15 -5 -12 2 C-10 6 0 3 0 0"/>
        <path d="M0 0 C8 -8 15 -5 12 2 C10 6 0 3 0 0"/>
        <ellipse cx="0" cy="5" rx="1" ry="5"/>
      </g>
      <g transform="translate(30, 100)" fill="#DA70D6" opacity="0.25" transform="scale(0.7)">
        <path d="M0 0 C-6 -6 -12 -4 -9 1.5 C-7.5 4.5 0 2 0 0"/>
        <path d="M0 0 C6 -6 12 -4 9 1.5 C7.5 4.5 0 2 0 0"/>
        <ellipse cx="0" cy="4" rx="0.8" ry="4"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Layer the patterns -->
  <rect width="200" height="200" fill="url(#spring-blossoms)"/>
  <rect width="200" height="200" fill="url(#spring-vines)"/>
  <rect width="200" height="200" fill="url(#spring-butterflies)"/>
</svg>
