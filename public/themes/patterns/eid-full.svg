<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Celebration bursts -->
    <pattern id="eid-celebration" patternUnits="userSpaceOnUse" width="100" height="100">
      <!-- Firework burst -->
      <g transform="translate(50, 50)" stroke="#FFD700" stroke-width="1.5" fill="none" opacity="0.4">
        <circle r="8" fill="#FFD700" opacity="0.5"/>
        <line x1="0" y1="-12" x2="0" y2="-25"/>
        <line x1="12" y1="0" x2="25" y2="0"/>
        <line x1="0" y1="12" x2="0" y2="25"/>
        <line x1="-12" y1="0" x2="-25" y2="0"/>
        <line x1="8.5" y1="-8.5" x2="17" y2="-17"/>
        <line x1="8.5" y1="8.5" x2="17" y2="17"/>
        <line x1="-8.5" y1="8.5" x2="-17" y2="17"/>
        <line x1="-8.5" y1="-8.5" x2="-17" y2="-17"/>
        <!-- Sparkle dots at ends -->
        <circle cx="0" cy="-28" r="2" fill="#FFD700"/>
        <circle cx="28" cy="0" r="2" fill="#FFD700"/>
        <circle cx="0" cy="28" r="2" fill="#FFD700"/>
        <circle cx="-28" cy="0" r="2" fill="#FFD700"/>
      </g>
      <!-- Small stars -->
      <g fill="#FFA500" opacity="0.3">
        <polygon points="20,20 21,23 24,23 22,25 23,28 20,26 17,28 18,25 16,23 19,23"/>
        <polygon points="75,80 76,83 79,83 77,85 78,88 75,86 72,88 73,85 71,83 74,83"/>
      </g>
    </pattern>
    
    <!-- Gift boxes -->
    <pattern id="eid-gifts" patternUnits="userSpaceOnUse" width="120" height="120">
      <!-- Gift box -->
      <g transform="translate(60, 70)" opacity="0.3">
        <rect x="-15" y="-5" width="30" height="25" fill="#9B59B6" stroke="#E74C3C" stroke-width="1"/>
        <!-- Ribbon vertical -->
        <rect x="-3" y="-5" width="6" height="25" fill="#E74C3C"/>
        <!-- Ribbon horizontal -->
        <rect x="-15" y="5" width="30" height="5" fill="#E74C3C"/>
        <!-- Lid -->
        <rect x="-17" y="-10" width="34" height="7" fill="#8E44AD" stroke="#E74C3C" stroke-width="1"/>
        <!-- Bow -->
        <ellipse cx="-5" cy="-13" rx="5" ry="3" fill="#E74C3C"/>
        <ellipse cx="5" cy="-13" rx="5" ry="3" fill="#E74C3C"/>
        <circle cx="0" cy="-12" r="3" fill="#C0392B"/>
      </g>
    </pattern>
    
    <!-- Confetti and streamers -->
    <pattern id="eid-confetti" patternUnits="userSpaceOnUse" width="80" height="80">
      <!-- Confetti pieces -->
      <rect x="10" y="15" width="6" height="3" fill="#E74C3C" opacity="0.4" transform="rotate(25, 13, 16.5)"/>
      <rect x="55" y="40" width="5" height="3" fill="#3498DB" opacity="0.35" transform="rotate(-15, 57.5, 41.5)"/>
      <rect x="30" y="60" width="6" height="3" fill="#2ECC71" opacity="0.4" transform="rotate(45, 33, 61.5)"/>
      <rect x="65" y="10" width="5" height="3" fill="#F1C40F" opacity="0.45" transform="rotate(-30, 67.5, 11.5)"/>
      <rect x="15" y="50" width="4" height="2" fill="#9B59B6" opacity="0.35" transform="rotate(60, 17, 51)"/>
      <!-- Circle confetti -->
      <circle cx="45" cy="25" r="2.5" fill="#E67E22" opacity="0.4"/>
      <circle cx="20" cy="35" r="2" fill="#1ABC9C" opacity="0.35"/>
      <circle cx="70" cy="65" r="2.5" fill="#E91E63" opacity="0.4"/>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#eid-celebration)"/>
  <rect width="200" height="200" fill="url(#eid-gifts)"/>
  <rect width="200" height="200" fill="url(#eid-confetti)"/>
</svg>
