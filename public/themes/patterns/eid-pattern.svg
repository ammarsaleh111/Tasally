<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Festive geometric -->
    <pattern id="eid-festive" patternUnits="userSpaceOnUse" width="50" height="50">
      <!-- Diamond shapes -->
      <polygon points="25,5 30,25 25,45 20,25" fill="none" stroke="currentColor" stroke-width="0.4" opacity="0.06"/>
      <circle cx="25" cy="25" r="3" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    <!-- Celebration dots -->
    <pattern id="eid-dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="10" cy="10" r="1" fill="currentColor" opacity="0.08"/>
      <circle cx="5" cy="15" r="0.5" fill="currentColor" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#eid-festive)"/>
  <rect width="100" height="100" fill="url(#eid-dots)"/>
</svg>
