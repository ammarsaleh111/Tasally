<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Frosted speckle -->
    <pattern id="winter-speckle" patternUnits="userSpaceOnUse" width="10" height="10">
      <circle cx="2" cy="3" r="0.3" fill="currentColor" opacity="0.2"/>
      <circle cx="7" cy="8" r="0.2" fill="currentColor" opacity="0.15"/>
      <circle cx="5" cy="1" r="0.25" fill="currentColor" opacity="0.1"/>
    </pattern>
    <!-- Cold wind diagonal lines -->
    <pattern id="winter-wind" patternUnits="userSpaceOnUse" width="30" height="30">
      <line x1="0" y1="30" x2="30" y2="0" stroke="currentColor" stroke-width="0.3" opacity="0.08"/>
      <line x1="10" y1="30" x2="40" y2="0" stroke="currentColor" stroke-width="0.2" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#winter-speckle)"/>
  <rect width="100" height="100" fill="url(#winter-wind)"/>
</svg>
