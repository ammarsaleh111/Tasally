<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <pattern id="spring-dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <!-- Sprout dots -->
      <circle cx="10" cy="10" r="1" fill="currentColor" opacity="0.4"/>
      <circle cx="5" cy="5" r="0.5" fill="currentColor" opacity="0.3"/>
      <circle cx="15" cy="15" r="0.5" fill="currentColor" opacity="0.3"/>
    </pattern>
    <pattern id="spring-vines" patternUnits="userSpaceOnUse" width="40" height="40">
      <!-- Curved vine lines -->
      <path d="M0 20 Q10 15 20 20 T40 20" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.2"/>
      <path d="M0 35 Q15 30 25 35 T40 35" fill="none" stroke="currentColor" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#spring-dots)"/>
  <rect width="100" height="100" fill="url(#spring-vines)"/>
</svg>
