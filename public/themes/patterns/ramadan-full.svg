<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Crescent moons and stars -->
    <pattern id="ramadan-celestial" patternUnits="userSpaceOnUse" width="100" height="100">
      <!-- Crescent moon -->
      <g transform="translate(50, 50)" opacity="0.4">
        <circle cx="0" cy="0" r="18" fill="#FFD700"/>
        <circle cx="6" cy="-3" r="14" fill="#0d1117"/>
      </g>
      <!-- Stars scattered -->
      <g fill="#FFD700" opacity="0.5">
        <polygon points="20,15 21,19 25,19 22,22 23,26 20,24 17,26 18,22 15,19 19,19" transform="scale(0.7)"/>
        <polygon points="80,70 81,74 85,74 82,77 83,81 80,79 77,81 78,77 75,74 79,74" transform="scale(0.5)"/>
        <polygon points="70,20 71,24 75,24 72,27 73,31 70,29 67,31 68,27 65,24 69,24" transform="scale(0.4)"/>
      </g>
    </pattern>
    
    <!-- Mosque domes silhouette -->
    <pattern id="ramadan-mosque" patternUnits="userSpaceOnUse" width="150" height="100">
      <g transform="translate(75, 90)" fill="#1a365d" opacity="0.15">
        <!-- Main dome -->
        <ellipse cx="0" cy="0" rx="30" ry="25"/>
        <rect x="-30" y="0" width="60" height="15"/>
        <!-- Minaret left -->
        <rect x="-50" y="-40" width="10" height="55"/>
        <polygon points="-50,-40 -45,-55 -40,-40"/>
        <!-- Minaret right -->
        <rect x="40" y="-40" width="10" height="55"/>
        <polygon points="40,-40 45,-55 50,-40"/>
        <!-- Small dome -->
        <ellipse cx="-20" cy="-5" rx="12" ry="10"/>
        <ellipse cx="20" cy="-5" rx="12" ry="10"/>
      </g>
    </pattern>
    
    <!-- Lantern decorations -->
    <pattern id="ramadan-lanterns" patternUnits="userSpaceOnUse" width="80" height="120">
      <g transform="translate(40, 60)" opacity="0.35">
        <!-- Lantern body -->
        <path d="M-8 -20 L8 -20 L10 20 L-10 20 Z" fill="#8B0000" stroke="#FFD700" stroke-width="1"/>
        <!-- Lantern top -->
        <polygon points="-8,-20 0,-30 8,-20" fill="#FFD700"/>
        <!-- Chain -->
        <line x1="0" y1="-30" x2="0" y2="-45" stroke="#FFD700" stroke-width="1"/>
        <!-- Light glow -->
        <ellipse cx="0" cy="0" rx="6" ry="15" fill="#FFA500" opacity="0.3"/>
        <!-- Decorative bands -->
        <line x1="-9" y1="-10" x2="9" y2="-10" stroke="#FFD700" stroke-width="0.5"/>
        <line x1="-9.5" y1="0" x2="9.5" y2="0" stroke="#FFD700" stroke-width="0.5"/>
        <line x1="-10" y1="10" x2="10" y2="10" stroke="#FFD700" stroke-width="0.5"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#ramadan-celestial)"/>
  <rect width="200" height="200" fill="url(#ramadan-mosque)"/>
  <rect width="200" height="200" fill="url(#ramadan-lanterns)"/>
</svg>
