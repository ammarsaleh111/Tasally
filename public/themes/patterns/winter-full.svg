<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Detailed snowflakes -->
    <pattern id="winter-snowflakes" patternUnits="userSpaceOnUse" width="100" height="100">
      <!-- Large snowflake -->
      <g transform="translate(50, 50)" stroke="#87CEEB" stroke-width="1.5" fill="none" opacity="0.5">
        <!-- 6 main arms -->
        <line x1="0" y1="-18" x2="0" y2="18"/>
        <line x1="-15.6" y1="-9" x2="15.6" y2="9"/>
        <line x1="-15.6" y1="9" x2="15.6" y2="-9"/>
        <!-- Branches on each arm -->
        <line x1="0" y1="-12" x2="-4" y2="-16"/>
        <line x1="0" y1="-12" x2="4" y2="-16"/>
        <line x1="0" y1="12" x2="-4" y2="16"/>
        <line x1="0" y1="12" x2="4" y2="16"/>
        <!-- Side branches -->
        <line x1="-10" y1="-5.8" x2="-14" y2="-2.5"/>
        <line x1="-10" y1="-5.8" x2="-10" y2="-10"/>
        <line x1="10" y1="5.8" x2="14" y2="2.5"/>
        <line x1="10" y1="5.8" x2="10" y2="10"/>
        <circle cx="0" cy="0" r="3" fill="#87CEEB"/>
      </g>
      <!-- Small snowflakes -->
      <g transform="translate(15, 20) scale(0.4)" stroke="#ADD8E6" stroke-width="1" fill="none" opacity="0.4">
        <line x1="0" y1="-15" x2="0" y2="15"/>
        <line x1="-13" y1="-7.5" x2="13" y2="7.5"/>
        <line x1="-13" y1="7.5" x2="13" y2="-7.5"/>
      </g>
      <g transform="translate(80, 75) scale(0.5)" stroke="#B0E0E6" stroke-width="1" fill="none" opacity="0.35">
        <line x1="0" y1="-15" x2="0" y2="15"/>
        <line x1="-13" y1="-7.5" x2="13" y2="7.5"/>
        <line x1="-13" y1="7.5" x2="13" y2="-7.5"/>
      </g>
    </pattern>
    
    <!-- Cozy elements: hot cocoa steam, mittens -->
    <pattern id="winter-cozy" patternUnits="userSpaceOnUse" width="150" height="150">
      <!-- Hot cocoa mug -->
      <g transform="translate(75, 100)" opacity="0.3">
        <rect x="-12" y="0" width="24" height="25" rx="3" fill="#8B4513"/>
        <ellipse cx="0" cy="0" rx="12" ry="4" fill="#6B3E26"/>
        <ellipse cx="0" cy="5" rx="9" ry="3" fill="#D2691E"/>
        <!-- Handle -->
        <path d="M12 5 Q20 5 20 12 Q20 20 12 20" fill="none" stroke="#8B4513" stroke-width="3"/>
        <!-- Steam -->
        <path d="M-3 -5 Q-5 -15 0 -20 Q5 -15 3 -5" fill="none" stroke="#DCDCDC" stroke-width="1.5" opacity="0.5"/>
        <path d="M5 -3 Q7 -12 4 -18" fill="none" stroke="#DCDCDC" stroke-width="1" opacity="0.4"/>
      </g>
      <!-- Mitten -->
      <g transform="translate(30, 40)" fill="#DC143C" opacity="0.25">
        <path d="M0 0 L0 25 Q0 35 10 35 L15 35 Q25 35 25 25 L25 8 L18 8 L18 0 Z"/>
        <path d="M0 8 L-8 0 Q-12 -4 -8 -8 Q-4 -12 0 -8 L5 0 Z"/>
        <!-- Cuff -->
        <rect x="-2" y="32" width="29" height="6" rx="2" fill="#FFFAF0"/>
      </g>
    </pattern>
    
    <!-- Frost crystals -->
    <pattern id="winter-frost" patternUnits="userSpaceOnUse" width="80" height="80">
      <g transform="translate(40, 40)" stroke="#E0FFFF" stroke-width="0.5" fill="none" opacity="0.2">
        <!-- Ice crystal formation -->
        <path d="M0 -30 L0 30"/>
        <path d="M-26 -15 L26 15"/>
        <path d="M-26 15 L26 -15"/>
        <path d="M0 -20 L-6 -26"/>
        <path d="M0 -20 L6 -26"/>
        <path d="M0 20 L-6 26"/>
        <path d="M0 20 L6 26"/>
      </g>
    </pattern>
  </defs>
  
  <rect width="200" height="200" fill="url(#winter-snowflakes)"/>
  <rect width="200" height="200" fill="url(#winter-cozy)"/>
  <rect width="200" height="200" fill="url(#winter-frost)"/>
</svg>
