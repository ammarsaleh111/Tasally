<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Paper grain texture -->
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
    <!-- Leaf silhouettes -->
    <pattern id="autumn-leaves" patternUnits="userSpaceOnUse" width="50" height="50">
      <!-- Maple leaf silhouette -->
      <path d="M25 5 L27 12 L35 10 L28 18 L32 25 L25 22 L18 25 L22 18 L15 10 L23 12 Z" 
            fill="currentColor" opacity="0.06" transform="rotate(15 25 15)"/>
      <!-- Small leaf -->
      <ellipse cx="40" cy="40" rx="4" ry="6" fill="currentColor" opacity="0.04" transform="rotate(-30 40 40)"/>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#autumn-leaves)"/>
  <!-- Subtle grain overlay -->
  <rect width="100" height="100" fill="currentColor" opacity="0.02"/>
</svg>
