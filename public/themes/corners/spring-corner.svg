<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Spring corner: leaves and vines -->
  <g fill="currentColor" opacity="0.3">
    <!-- Main leaf -->
    <path d="M10 70 Q20 50 35 45 Q25 55 20 70 Z"/>
    <!-- Small leaves -->
    <ellipse cx="45" cy="35" rx="8" ry="4" transform="rotate(-45 45 35)"/>
    <ellipse cx="55" cy="25" rx="6" ry="3" transform="rotate(-30 55 25)"/>
    <!-- Vine curl -->
    <path d="M5 75 Q15 60 25 55 Q35 50 45 40" fill="none" stroke="currentColor" stroke-width="2" opacity="0.2"/>
    <!-- Small buds -->
    <circle cx="48" cy="38" r="2"/>
    <circle cx="58" cy="22" r="1.5"/>
  </g>
</svg>
