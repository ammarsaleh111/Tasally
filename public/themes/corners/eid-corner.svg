<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Eid corner: festive decorations -->
  <g fill="currentColor" opacity="0.35">
    <!-- Crescent with star -->
    <path d="M20 30 A12 12 0 1 1 20 54 A9 9 0 1 0 20 30"/>
    <polygon points="35,35 37,40 42,40 38,44 40,49 35,46 30,49 32,44 28,40 33,40" 
             transform="rotate(15 35 42)"/>
    <!-- Festive pennants -->
    <g transform="translate(50 20)">
      <polygon points="0,0 8,0 4,12"/>
      <polygon points="10,0 18,0 14,12" opacity="0.7"/>
      <polygon points="20,0 28,0 24,12" opacity="0.5"/>
      <line x1="-2" y1="0" x2="30" y2="0" stroke="currentColor" stroke-width="1.5"/>
    </g>
    <!-- Gift box -->
    <g transform="translate(60 55)">
      <rect x="-8" y="0" width="16" height="12" rx="1"/>
      <rect x="-8" y="-3" width="16" height="4" rx="1"/>
      <line x1="0" y1="-3" x2="0" y2="12" stroke="currentColor" stroke-width="2" opacity="0.5"/>
      <!-- Ribbon bow -->
      <ellipse cx="-3" cy="-5" rx="3" ry="2"/>
      <ellipse cx="3" cy="-5" rx="3" ry="2"/>
    </g>
  </g>
</svg>
