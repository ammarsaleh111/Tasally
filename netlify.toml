[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Retain the existing adapter dependency for this recovery change.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# No catch-all redirect or forced MIME types. Verify both domains independently.

[context.production]
  command = "npm run build && node scripts/prepare-anonymous-names.mjs"
